<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150" role="img" aria-label="enterprise-auth-stack at a glance: SAML 2.0 identity in from Okta, Azure or OneLogin, SCIM 2.0 provisioning, the failure it stops is a stale cert resolved fresh per login, verified by 59 tests across 6 suites with no network calls">
  <rect width="880" height="150" rx="10" fill="#0d1117" stroke="#30363d"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect x="20" y="30" width="195" height="96" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="36" y="56" fill="#7d8590" font-size="11" letter-spacing="1">IDENTITY IN</text>
    <text x="36" y="82" fill="#58a6ff" font-size="16" font-weight="600">SAML 2.0</text>
    <text x="36" y="106" fill="#7d8590" font-size="12">Okta, Azure, OneLogin</text>
    <rect x="235" y="30" width="195" height="96" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="251" y="56" fill="#7d8590" font-size="11" letter-spacing="1">PROVISIONING</text>
    <text x="251" y="82" fill="#58a6ff" font-size="16" font-weight="600">SCIM 2.0</text>
    <text x="251" y="106" fill="#7d8590" font-size="12">create, patch, delete</text>
    <rect x="450" y="30" width="195" height="96" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="466" y="56" fill="#7d8590" font-size="11" letter-spacing="1">FAILURE IT STOPS</text>
    <text x="466" y="82" fill="#d29922" font-size="16" font-weight="600">stale cert</text>
    <text x="466" y="106" fill="#7d8590" font-size="12">resolved fresh per login</text>
    <rect x="665" y="30" width="195" height="96" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="681" y="56" fill="#7d8590" font-size="11" letter-spacing="1">VERIFIED</text>
    <text x="681" y="82" fill="#3fb950" font-size="16" font-weight="600">59 tests</text>
    <text x="681" y="106" fill="#7d8590" font-size="12">0 network, 6 suites</text>
  </g>
</svg>
