<svg xmlns="http://www.w3.org/2000/svg" width="648" height="218" viewBox="0 0 648 218" role="img" aria-label="sign, verify, rotate: issueInternalToken signs a JWT and jwt.verify accepts it; the signing secret rotates; the old token FAILS verification against the rotated secret; a new token issued under the rotated secret verifies clean">
  <rect width="648" height="218" rx="10" fill="#0d1117" stroke="#30363d"/>
  <path d="M0 10a10 10 0 0 1 10-10h628a10 10 0 0 1 10 10v28H0z" fill="#161b22"/>
  <circle cx="20" cy="19" r="6" fill="#ff5f57"/><circle cx="38" cy="19" r="6" fill="#febc2e"/><circle cx="56" cy="19" r="6" fill="#28c840"/>
  <text x="74" y="23" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#7d8590">sign, verify, rotate</text>
  <text x="26" y="54" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="500"><tspan fill="#3fb950">$&#160;</tspan><tspan fill="#e6edf3">ts-node scripts/demo-sign-verify-rotate.ts</tspan></text>
    <text x="26" y="76" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="500" fill="#c9d1d9">sign   tenant-acme admin -&gt; token issued, exp 3600s</text>
    <text x="26" y="98" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="500" fill="#3fb950">verify token ok  sub=okta|demo-user role=admin tenantId=tenant-acme</text>
    <text x="26" y="120" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="500" fill="#d29922">rotate JWT_SECRET_DEV_ONLY -&gt; new value</text>
    <text x="26" y="142" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="500" fill="#f85149">verify old token against rotated secret: FAILED (signature invalid)</text>
    <text x="26" y="164" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="500" fill="#c9d1d9">sign   tenant-acme admin -&gt; token issued under rotated secret</text>
    <text x="26" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="500" fill="#3fb950">verify new token ok  sub=okta|demo-user role=admin tenantId=tenant-acme</text>
</svg>
