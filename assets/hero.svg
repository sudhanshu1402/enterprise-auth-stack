<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="enterprise-auth-stack as a blueprint: browser to Express and Passport, which reads the tenant&#x27;s IdP config from Secrets Manager on every request, talks to the tenant IdP, and issues a 1 hour internal JWT. When the IdP rotates its cert, the very next login works. Spec: Admin maps to admin, else member; duplicate SCIM user returns 409; rate limits 600 and 300 per 15 minutes." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>.mo{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace}.sa{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}.se{font-family:Georgia,"Times New Roman",serif}.bl{font-family:"Arial Black","Helvetica Neue",Helvetica,Arial,sans-serif}
.in{opacity:0;animation:in .5s ease-out forwards}@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.dr{stroke-dasharray:1600;stroke-dashoffset:1600;animation:dr 2.2s ease-in-out forwards}@keyframes dr{to{stroke-dashoffset:0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}</style>
<defs><pattern id="s" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#2f6fd6" stroke-width=".6"/></pattern><pattern id="g" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="url(#s)"/><path d="M100 0H0V100" fill="none" stroke="#4f8ef0" stroke-width="1.2"/></pattern>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fff"/></marker></defs>
<rect width="1200" height="500" fill="#1450b8"/><rect width="1200" height="500" fill="url(#g)"/><rect x="18" y="18" width="1164" height="464" fill="none" stroke="#e8f0ff" stroke-width="2"/>
<text x="48" y="80" class="sa" font-size="42" font-weight="700" fill="#fff">ENTERPRISE-AUTH-STACK</text>
<text x="50" y="110" class="mo" font-size="15" fill="#cfe0ff">SAML 2.0 + SCIM 2.0 for B2B tenants · drawing: what happens when an IdP rotates its cert</text>
<g class="in" style="animation-delay:0s"><rect x="60" y="200" width="150" height="70" fill="#1a5cc8" stroke="#fff" stroke-width="2"/><text x="135.0" y="237.0" text-anchor="middle" class="mo" font-size="16" fill="#fff">browser</text><text x="135.0" y="257.0" text-anchor="middle" class="mo" font-size="11" fill="#bcd4ff">/saml/:tenant/login</text></g><g class="in" style="animation-delay:0.3s"><rect x="280" y="200" width="190" height="70" fill="#1a5cc8" stroke="#fff" stroke-width="2"/><text x="375.0" y="237.0" text-anchor="middle" class="mo" font-size="16" fill="#fff">Express</text><text x="375.0" y="257.0" text-anchor="middle" class="mo" font-size="11" fill="#bcd4ff">+ Passport.js</text></g><g class="in" style="animation-delay:0.6s"><rect x="540" y="150" width="200" height="70" fill="#1a5cc8" stroke="#fff" stroke-width="2"/><text x="640.0" y="187.0" text-anchor="middle" class="mo" font-size="16" fill="#fff">Secrets Manager</text><text x="640.0" y="207.0" text-anchor="middle" class="mo" font-size="11" fill="#bcd4ff">read per request</text></g><g class="in" style="animation-delay:0.9s"><rect x="540" y="270" width="200" height="70" fill="#1a5cc8" stroke="#fff" stroke-width="2"/><text x="640.0" y="307.0" text-anchor="middle" class="mo" font-size="16" fill="#fff">tenant IdP</text><text x="640.0" y="327.0" text-anchor="middle" class="mo" font-size="11" fill="#bcd4ff">Okta / Azure AD</text></g><g class="in" style="animation-delay:1.2s"><rect x="820" y="200" width="150" height="70" fill="#1a5cc8" stroke="#fff" stroke-width="2"/><text x="895.0" y="237.0" text-anchor="middle" class="mo" font-size="16" fill="#fff">JWT</text><text x="895.0" y="257.0" text-anchor="middle" class="mo" font-size="11" fill="#bcd4ff">internal · 1 h</text></g>
<g stroke="#fff" stroke-width="2" fill="none" marker-end="url(#a)" class="in" style="animation-delay:1.4s"><path d="M210 235H278"/><path d="M470 225L538 190"/><path d="M470 245L538 300"/><path d="M740 305C790 305 780 245 818 240"/></g>
<g class="in" style="animation-delay:1.8s"><circle cx="740" cy="150" r="11" fill="#ffd166"/><text x="740" y="155" text-anchor="middle" class="mo" font-size="13" font-weight="700" fill="#1450b8">1</text><circle cx="72" cy="392" r="11" fill="#ffd166"/><text x="72" y="397" text-anchor="middle" class="mo" font-size="13" font-weight="700" fill="#1450b8">1</text><text x="92" y="390" class="mo" font-size="14" fill="#ffd166">IdP rotates its cert → the very next login works.</text><text x="92" y="410" class="mo" font-size="14" fill="#ffd166">config is read per request, so no cached strategy outlives it.</text></g>
<line x1="995" x2="995" y1="170" y2="440" stroke="#e8f0ff"/>
<g class="mo" font-size="12" fill="#e8f0ff"><text x="1012" y="196">SPEC</text><text x="1012" y="226">roles: Admin → admin</text><text x="1012" y="250">       else → member</text><text x="1012" y="278">SCIM dup user → 409</text><text x="1012" y="306">SSO limit 600/15m</text><text x="1012" y="330">SCIM limit 300/15m</text><text x="1012" y="358">tests: no network</text></g>
<text x="48" y="456" class="mo" font-size="12" fill="#9fc0ff">REFERENCE IMPLEMENTATION · IN-MEMORY USER STORE · SHEET 1 OF 1</text></svg>